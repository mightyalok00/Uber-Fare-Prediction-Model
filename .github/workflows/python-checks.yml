name: Python Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile train.py app/app.py

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app/app.py", default_timeout=90).run()
          assert len(app.exception) == 0, [str(exc) for exc in app.exception]
          assert any(button.label == "Predict Fare" for button in app.button)
          assert len(app.tabs) == 5
          expected_tabs = {
              "🚕 Predict Fare",
              "📊 Business Dashboard",
              "🤖 Model Performance",
              "🧪 Data Quality",
              "ℹ️ About",
          }
          assert {tab.label for tab in app.tabs} == expected_tabs
          print("PASS: Streamlit app starts without exceptions and exposes the expected five tabs")
          PY

name: Python Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile train.py app/app.py

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate final model bundle
        run: |
          python - <<'PY'
          import json
          import joblib

          FEATURES = [
              "city", "payment_method", "distance_km", "pickup_year", "pickup_month",
              "pickup_day", "pickup_hour", "day_of_week", "is_weekend", "is_rush_hour",
          ]

          with open("models/model_metadata.json", encoding="utf-8") as fh:
              meta = json.load(fh)
          model = joblib.load("models/uber_fare_model.pkl")

          assert meta["artifact_status"] == "coordinate_safe_final_model"
          assert meta["best_model"] == "Linear Regression"
          assert meta["features"] == FEATURES
          assert meta["persistence_roundtrip"] == "PASS"
          assert model.named_steps["model"].__class__.__name__ == "LinearRegression"
          print("PASS: final model bundle matches the latest Streamlit contract")
          PY

      - name: Streamlit smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("app/app.py", default_timeout=90).run()
          assert len(app.exception) == 0, [str(exc) for exc in app.exception]
          assert len(app.tabs) == 5
          print("PASS: Streamlit app starts without exceptions")
          PY
